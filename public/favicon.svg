<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded container with subtle dark background for dark/light browser chrome -->
  <rect width="32" height="32" rx="7" fill="#09090b" />
  <g stroke="#f4f4f5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tangent lines & dots -->
    <line x1="8" y1="5" x2="20" y2="5" stroke-width="0.9" opacity="0.85" />
    <circle cx="8" cy="5" r="1.1" fill="#f4f4f5" stroke="none" />
    <circle cx="20" cy="5" r="1.1" fill="#f4f4f5" stroke="none" />

    <line x1="7" y1="6" x2="7" y2="18" stroke-width="0.9" opacity="0.85" />
    <circle cx="7" cy="6" r="1.1" fill="#f4f4f5" stroke="none" />
    <circle cx="7" cy="18" r="1.1" fill="#f4f4f5" stroke="none" />

    <!-- Loupe Handle -->
    <line x1="19" y1="18" x2="26" y2="25" stroke-width="3" />

    <!-- Main Lens Circle -->
    <circle cx="14" cy="12" r="7.5" stroke-width="1.8" />

    <!-- Reflection glint -->
    <path d="M 10 9 A 5 5 0 0 1 18 9" stroke-width="1.1" opacity="0.9" />

    <!-- Cardinal Anchor Squares -->
    <rect x="13" y="3.5" width="2" height="2" fill="#f4f4f5" stroke="#09090b" stroke-width="0.4" />
    <rect x="5.5" y="11" width="2" height="2" fill="#f4f4f5" stroke="#09090b" stroke-width="0.4" />
    <rect x="20.5" y="11" width="2" height="2" fill="#f4f4f5" stroke="#09090b" stroke-width="0.4" />
    <rect x="13" y="18.5" width="2" height="2" fill="#f4f4f5" stroke="#09090b" stroke-width="0.4" />
  </g>
</svg>
